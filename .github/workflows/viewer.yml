name: Viewer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    # 10 minutes until 2026-11-14. PR #51 added 24 browser tests (74 in all); the push run of 922a032 was cancelled at 10 minutes with
    # 72 of 74 passed, and the pull_request run took 8.5 minutes. 20 leaves room for the suite as it is now.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Check generated HTML is current
        run: git diff --exit-code -- index.html
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  # Not a gate: the WebKit engine on Linux is not iOS Safari, and WebGL on the runner may not work.
  # The result shows whether the single HTML file starts on WebKit at all.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 14
